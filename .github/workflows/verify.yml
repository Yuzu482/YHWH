name: Isolated WSL fixture discovery checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Install locked dependencies
        working-directory: payload/pi-dispatch
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Check absent default and required distro
        working-directory: payload/pi-dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(& node --test '--test-name-pattern=WSL fixture discovery|production root functions' 'tests/patch-policy.test.mjs' 2>&1)
          $code = $LASTEXITCODE
          $text = $lines -join "`n"
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or -not $text.Contains('SKIP WSL test distribution Ubuntu-24.04 is not installed')) { throw 'Absent default distro was not reported as a skip' }
          $env:PI_TEST_WSL_DISTRO = 'YHWH-intentionally-absent'
          $lines = @(& node --test '--test-name-pattern=production root functions' 'tests/patch-policy.test.mjs' 2>&1)
          $code = $LASTEXITCODE
          Remove-Item Env:PI_TEST_WSL_DISTRO
          $text = $lines -join "`n"
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 1 -or -not $text.Contains('Configured WSL test distribution YHWH-intentionally-absent is not installed')) { throw 'Explicitly requested missing distro was not rejected' }
          $global:LASTEXITCODE = 0
