name: Build verified public release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: '629ef811125af4fba6f40ff901182dc1fe5df784'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare the pinned PowerShell runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dep = (Get-Content -LiteralPath './install/bootstrap-dependencies.json' -Raw | ConvertFrom-Json).powershell
          $expectedUrl = 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.5/PowerShell-7.6.5-win-x64.zip'
          $expectedHash = '32eb8f6cdce08f86e987d625a2733e54ac3e289ae7e1621b14c0b5bcec2434ea'
          if ($dep.version -cne '7.6.5' -or $dep.url -cne $expectedUrl -or $dep.sha256 -cne $expectedHash) { throw 'Unexpected pinned PowerShell metadata' }
          $archive = Join-Path $env:RUNNER_TEMP 'yhwh-powershell-7.6.5.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'yhwh-powershell-7.6.5'
          if ((Test-Path -LiteralPath $archive) -or (Test-Path -LiteralPath $runtime)) { throw 'Pinned runtime destination already exists' }
          Invoke-WebRequest -Uri $expectedUrl -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) { throw 'Pinned PowerShell digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $engine = Join-Path $runtime 'pwsh.exe'
          $version = (& $engine -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '7.6.5') { throw 'Pinned PowerShell version mismatch' }
      - name: Verify canonical clean main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_MAIN -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid expected main commit' }
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_MAIN) { throw 'Checkout does not match verified main' }
          $status = (git status --porcelain --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Checkout is not clean' }
          $origin = (git remote get-url origin | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $origin -cnotin @('https://github.com/Yuzu482/YHWH', 'https://github.com/Yuzu482/YHWH.git')) { throw 'Unexpected source origin' }
          $remote = (git -c credential.helper= ls-remote --heads origin main | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:EXPECTED_MAIN + "`trefs/heads/main")) { throw 'Main advanced or cannot be verified' }
      - name: Build and verify public release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'yhwh-verified-release'
          if (Test-Path -LiteralPath $release) { throw 'Release output already exists' }
          $engine = Join-Path $env:RUNNER_TEMP 'yhwh-powershell-7.6.5/pwsh.exe'
          & $engine -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './Build-Release.ps1' -PublicRelease -OutputDirectory $release
          if ($LASTEXITCODE -ne 0) { throw 'Public release build failed' }
          $manifest = Get-Content -LiteralPath (Join-Path $release 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.dirty -or $manifest.sourceCommit -cne $env:EXPECTED_MAIN -or $manifest.version -cne '0.15.1') { throw 'Release provenance mismatch' }
          $zip = Join-Path $release 'YHWH-OneClick-0.15.1.zip'
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($zip + '.sha256'), ($zipHash + '  ' + [IO.Path]::GetFileName($zip) + "`r`n"), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $release 'SOURCE_COMMIT.txt'), ($env:EXPECTED_MAIN + "`r`n"), [Text.Encoding]::ASCII)
          $names = @('Install-YHWH-0.15.1.ps1', 'pi-kether-portable-0.15.1.zip', 'YHWH-OneClick-0.15.1.zip')
          $lines = @(foreach ($name in $names) {
            $file = Join-Path $release $name
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $record = (Get-Content -LiteralPath ($file + '.sha256') -Raw).Trim()
            if ($record -cne ($hash + '  ' + $name)) { throw ('Asset checksum mismatch: ' + $name) }
            $record
          })
          [IO.File]::WriteAllText((Join-Path $release 'SHA256SUMS.txt'), (($lines -join "`r`n") + "`r`n"), [Text.Encoding]::ASCII)
          $remote = (git -c credential.helper= ls-remote --heads origin main | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:EXPECTED_MAIN + "`trefs/heads/main")) { throw 'Main changed before artifact upload' }
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yhwh-0.15.1-verified-public-release
          path: |
            ${{ runner.temp }}/yhwh-verified-release/Install-YHWH-0.15.1.ps1
            ${{ runner.temp }}/yhwh-verified-release/Install-YHWH-0.15.1.ps1.sha256
            ${{ runner.temp }}/yhwh-verified-release/pi-kether-portable-0.15.1.zip
            ${{ runner.temp }}/yhwh-verified-release/pi-kether-portable-0.15.1.zip.sha256
            ${{ runner.temp }}/yhwh-verified-release/release-manifest.json
            ${{ runner.temp }}/yhwh-verified-release/SHA256SUMS.txt
            ${{ runner.temp }}/yhwh-verified-release/SOURCE_COMMIT.txt
            ${{ runner.temp }}/yhwh-verified-release/YHWH-OneClick-0.15.1.zip
            ${{ runner.temp }}/yhwh-verified-release/YHWH-OneClick-0.15.1.zip.sha256
          if-no-files-found: error
          retention-days: 7
