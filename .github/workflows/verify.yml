name: Verify portable workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        working-directory: payload/pi-dispatch
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Credential-free runtime checks
        working-directory: payload/pi-dispatch
        run: |
          node --test --test-concurrency=1 tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime tests failed' }
          node --expose-gc tests/memory-regression.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Memory regression failed' }
      - name: Package and verify extracted installer
        run: |
          ./Build-Release.ps1 -SkipTests
      - name: Clean target installation plan
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'yhwh-empty-home'
          ./install/Install-PiKether.ps1 -PlanOnly -TargetHome $target -WorkspaceRoots $env:GITHUB_WORKSPACE -SkipWsl -SkipTunnel -SkipCodexRegistration
