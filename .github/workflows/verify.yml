name: Isolated WSL availability diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-wsl:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Inspect WSL status and fixture requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'yhwh-wsl-availability.cjs'
          @'
          const {spawnSync}=require('node:child_process');
          const decode=b=>!b?'':b.includes(0)?b.toString('utf16le').replace(/\0/g,''):b.toString('utf8');
          for(const [name,args,input] of [
            ['status',['--status'],undefined],
            ['list',['--list','--quiet'],undefined],
            ['distro-node',['-d','Ubuntu-24.04','-u','root','--cd','/','--exec','/opt/node/bin/node','--version'],undefined],
            ['distro-input',['-d','Ubuntu-24.04','-u','root','--cd','/','--exec','/opt/node/bin/node','--input-type=module'],'console.log("fixture")']
          ]) {
            const r=spawnSync('wsl.exe',args,{input,encoding:'buffer',timeout:10000});
            console.log(JSON.stringify({name,status:r.status,signal:r.signal,error:r.error&&{code:r.error.code,message:r.error.message},stdout:decode(r.stdout),stderr:decode(r.stderr)}));
          }
          '@ | Set-Content -LiteralPath $script -Encoding utf8NoBOM
          node $script
          if ($LASTEXITCODE -ne 0) { throw 'WSL diagnostic failed' }
