name: Isolated release artifact transport probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Create synthetic release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'yhwh-verified-release'
          if (Test-Path -LiteralPath $dir) { throw 'Synthetic output already exists' }
          New-Item -ItemType Directory -Path $dir | Out-Null
          $names = @('Install-YHWH-0.15.1.ps1', 'Install-YHWH-0.15.1.ps1.sha256', 'pi-kether-portable-0.15.1.zip', 'pi-kether-portable-0.15.1.zip.sha256', 'release-manifest.json', 'SHA256SUMS.txt', 'SOURCE_COMMIT.txt', 'YHWH-OneClick-0.15.1.zip', 'YHWH-OneClick-0.15.1.zip.sha256')
          foreach ($name in $names) { [IO.File]::WriteAllText((Join-Path $dir $name), ('synthetic transport probe: ' + $name), [Text.Encoding]::ASCII) }
      - name: Upload synthetic files only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yhwh-release-transport-probe
          path: |
            ${{ runner.temp }}/yhwh-verified-release/Install-YHWH-0.15.1.ps1
            ${{ runner.temp }}/yhwh-verified-release/Install-YHWH-0.15.1.ps1.sha256
            ${{ runner.temp }}/yhwh-verified-release/pi-kether-portable-0.15.1.zip
            ${{ runner.temp }}/yhwh-verified-release/pi-kether-portable-0.15.1.zip.sha256
            ${{ runner.temp }}/yhwh-verified-release/release-manifest.json
            ${{ runner.temp }}/yhwh-verified-release/SHA256SUMS.txt
            ${{ runner.temp }}/yhwh-verified-release/SOURCE_COMMIT.txt
            ${{ runner.temp }}/yhwh-verified-release/YHWH-OneClick-0.15.1.zip
            ${{ runner.temp }}/yhwh-verified-release/YHWH-OneClick-0.15.1.zip.sha256
          if-no-files-found: error
          retention-days: 7
